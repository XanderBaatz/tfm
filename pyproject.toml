[project]
name = "default"
version = "0.1.0"
description = "This repository contains configurations to set up a Python development environment using VSCode's Dev Container feature. The environment includes uv and Ruff."

authors = [{ name = "a5chin", email = "a5chin.origin+contact@gmail.com" }]
maintainers = [{ name = "a5chin", email = "a5chin.origin+contact@gmail.com" }]

requires-python = ">=3.11"
readme = "README.md"
license = { file = "LICENSE" }

dependencies = [
    "ase>=3.29.0",
    "beartype>=0.22.9",
    "chemparse>=0.3.2",
    "fire>=0.7.1",
    "flow-matching>=1.0.10",
    "google-cloud-logging>=3.15.0",
    "hydra-core>=1.3.5",
    "jaxtyping>=0.3.10",
    "lightning>=2.6.5",
    "matminer>=0.10.1",
    "matplotlib>=3.11.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "pymatgen>=2026.5.4",
    "scikit-learn>=1.9.0",
    "seaborn>=0.13.2",
    "smact>=4.0.0",
    "torch-geometric>=2.8.0.post1",
    "wandb>=0.29.0",
]

[dependency-groups]
dev = [
    "cookiecutter>=2.7.1",
    "cookiecutter-data-science>=2.3.0",
    "einops>=0.8.2",
    "ipykernel>=7.2.0",
    "jupyter>=1.1.1",
    "mkdocs-material>=9.7.6",
    "nox>=2026.4.10",
    "pre-commit>=4.6.0",
    "pypdf>=6.14.2",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.15",
    "sqlfluff>=4.2.1",
    "torchvision>=0.28.0",
    "ty>=0.0.40",
]

#[tool.uv.extra-build-dependencies]
#torch-scatter = ["torch"]

[tool.hatch.build.targets.wheel]
packages = ["tools", "src/kfm", "src/fm", "src/kfm_new"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
