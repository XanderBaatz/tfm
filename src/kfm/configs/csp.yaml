defaults:
  - _self_
  - manifold: torus
  - data_module: mp_20
  - metrics: csp
  - trainer: default
  - callbacks: default
  - logger: wandb
  - lightning_module: default
  - lightning_module/flow_module: default
  - lightning_module/flow_module/vector_field_model: cspanet
  - lightning_module/flow_module/multi_flow: csp

project: "kfm"
dataset: "mp_20"
tags:
  - "mp_20"
  - "csp"
  - "simplified_param_${simplified_parameterization}"
  - "zero_v0_${zero_v0}"
  - "zero_v1_${zero_v1}"
  - "zero_cog_v_${zero_cog_v}"
  - "lattice_param_${lattice_parameterization}"
  - "abs_node_v_emb_${abs_node_v_emb}"
seed: 42
train: true
lr: 1e-3
zero_cog_v: true
zero_v0: false
zero_v1: true
simplified_parameterization: false
lattice_parameterization: "x1"
layer_normalization: true
abs_node_v_emb: false
val_every_n_epoch: 25
# Must be a multiple of `val_every_n_epoch` so a validation pass always coincides
# with the (expensive, ODE-sampling-based) structure evaluation.
struct_eval_every_n_epoch: 25
monitor_metric: "val/match_rate"
